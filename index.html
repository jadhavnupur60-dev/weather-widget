
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Widget - Favorite Cities</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="weather-container">
        <h1>🌤️ Weather Widget</h1>
        <p>Check the current weather of any city.</p>

        <form id="weatherForm">
            <label for="apiKey">OpenWeatherMap API Key</label>
            <input
                type="password"
                id="apiKey"
                placeholder="Enter your API key"
                autocomplete="off"
                required
            >

            <label for="cityInput">City Name</label>
            <input
                type="text"
                id="cityInput"
                placeholder="Enter city, e.g. Pune"
                required
            >

            <div class="main-buttons">
                <button type="submit">Get Weather</button>
                <button type="button" id="addFavoriteBtn">
                    ⭐ Add to Favorites
                </button>
            </div>
        </form>

        <p id="message" role="status" aria-live="polite"></p>

        <section id="weatherResult" aria-live="polite">
            <!-- Weather details appear here -->
        </section>

        <section class="favorites-section">
            <h2>❤️ Favorite Cities</h2>
            <p>Click a saved city to check its weather.</p>
            <div id="favoritesList" class="favorites-list">
                <!-- Favorite city buttons appear here -->
            </div>
        </section>
    </main>
</body>
</html>
